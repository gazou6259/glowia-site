<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connecter un salon — GlowIA</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --laque:#6E1D31; --laque-clair:#8C2E45; --laque-fonce:#4A1220;
    --ivoire:#F7EFE2; --porcelaine:#FDF9F1; --laiton:#C79A56; --laiton-profond:#A97C33;
    --encre:#2B1A1F; --encre-doux:#5a4148;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{overflow-x:hidden;}
  body{background:var(--ivoire);color:var(--encre);font-family:'Work Sans',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .card{background:#fff;border-radius:20px;padding:44px 38px;max-width:420px;width:100%;box-shadow:0 30px 60px -30px rgba(110,29,49,.3);}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:28px;}
  .brand-mark{width:30px;height:31px;}
  .brand .word{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:20px;color:var(--laque);}
  .brand .ia{color:var(--laiton-profond);font-style:italic;}
  h1{font-family:'Fraunces',Georgia,serif;font-weight:500;font-size:22px;color:var(--laque);margin-bottom:8px;}
  p.sub{font-size:14px;color:var(--encre-doux);margin-bottom:26px;}
  .field{margin-bottom:18px;}
  .field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;}
  .field input{width:100%;border:1px solid #e3d7c6;border-radius:10px;padding:12px 14px;font-size:14.5px;font-family:'Work Sans',sans-serif;}
  .btn{width:100%;background:var(--laque);color:var(--ivoire);border:none;border-radius:10px;padding:14px;font-size:15px;font-weight:600;cursor:pointer;margin-top:8px;display:flex;align-items:center;justify-content:center;gap:10px;}
  .btn:hover{background:var(--laque-clair);}
  .btn:disabled{opacity:.5;cursor:default;}
  .status{margin-top:16px;font-size:13.5px;min-height:1.2em;}
  .status.ok{color:#3d7a4a;}
  .status.err{color:#a33;}
</style>
</head>
<body>

<div class="card">
  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 64 66" role="img" aria-label="GlowIA">
      <rect x="4" y="6" width="56" height="40" rx="14" fill="#6E1D31"></rect>
      <path d="M14 44 L14 62 L32 45 Z" fill="#6E1D31"></path>
      <path d="M19 20 A13 13 0 0 0 45 20" fill="none" stroke="#C79A56" stroke-width="7" stroke-linecap="round"></path>
    </svg>
    <span class="word">Glow<span class="ia">IA</span></span>
  </div>

  <h1>Connecter un nouveau salon</h1>
  <p class="sub">Entrez l'identifiant du salon, puis connectez son WhatsApp Business et son Instagram via Meta.</p>

  <div class="field">
    <label for="salonId">Identifiant salon (slug)</label>
    <input type="text" id="salonId" placeholder="ex: gazou">
  </div>

  <button class="btn" id="connectBtn" disabled>Connecter WhatsApp &amp; Instagram</button>
  <p class="status" id="status"></p>
</div>

<script>
  // ⚠️ À REMPLIR : voir instructions ci-dessous
  var META_APP_ID = '1144959613784009';
  var META_CONFIG_ID = '2922643884755372';
  var WEBHOOK_URL = 'https://iagentleman.app.n8n.cloud/webhook/embedded-signup-glowia';

  window.fbAsyncInit = function() {
    FB.init({ appId: META_APP_ID, autoLogAppEvents: true, xfbml: true, version: 'v21.0' });
  };

  (function(d, s, id){
    var js, fjs = d.getElementsByTagName(s)[0];
    if (d.getElementById(id)) return;
    js = d.createElement(s); js.id = id;
    js.src = "https://connect.facebook.net/fr_FR/sdk.js";
    fjs.parentNode.insertBefore(js, fjs);
  }(document, 'script', 'facebook-jssdk'));

  var salonInput = document.getElementById('salonId');
  var btn = document.getElementById('connectBtn');
  var status = document.getElementById('status');

  salonInput.addEventListener('input', function(){
    btn.disabled = !salonInput.value.trim();
  });

  btn.addEventListener('click', function(){
    var salonId = salonInput.value.trim();
    if (!salonId) return;

    status.className = 'status';
    status.textContent = '';
    btn.disabled = true;
    btn.textContent = 'Connexion en cours…';

    FB.login(function(response) {
      if (response.authResponse && response.authResponse.code) {
        fetch(WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code: response.authResponse.code, salon_id: salonId })
        }).then(function(r){ return r.json(); }).then(function(data){
          btn.disabled = false;
          btn.textContent = 'Connecter WhatsApp & Instagram';
          if (data.success) {
            status.className = 'status ok';
            status.textContent = '✓ Connecté avec succès pour "' + salonId + '"';
          } else {
            status.className = 'status err';
            status.textContent = 'Erreur : ' + (data.message || 'réessayez.');
          }
        }).catch(function(){
          btn.disabled = false;
          btn.textContent = 'Connecter WhatsApp & Instagram';
          status.className = 'status err';
          status.textContent = 'Un souci réseau est survenu, réessayez.';
        });
      } else {
        btn.disabled = false;
        btn.textContent = 'Connecter WhatsApp & Instagram';
        status.className = 'status err';
        status.textContent = 'Connexion annulée ou refusée.';
      }
    }, {
      config_id: META_CONFIG_ID,
      response_type: 'code',
      override_default_response_type: true,
      extras: { setup: {}, featureType: 'whatsapp_business_app_onboarding', sessionInfoVersion: '3' }
    });
  });
</script>

</body>
</html>
