<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Connexion Google — GlowIA</title>
<style>body{font-family:'Work Sans',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:90vh;color:#2B1A1F;background:#F7EFE2;text-align:center;padding:20px}p{max-width:360px;line-height:1.55;font-size:16px}a{display:inline-block;margin-top:14px;background:#6E1D31;color:#F7EFE2;text-decoration:none;padding:12px 20px;border-radius:10px;font-weight:600}</style></head>
<body><div><p id="m">Connexion Google en cours…</p><a id="back" href="/portail" style="display:none">Revenir à mon espace</a></div>
<script>
(function(){
  var p = new URLSearchParams(location.search);
  var msg = { type: 'GLOWIA_GOOGLE', code: p.get('code') || '', state: p.get('state') || '', error: p.get('error') || '' };
  var m = document.getElementById('m'), back = document.getElementById('back');
  history.replaceState(null, '', location.pathname);
  if (window.opener && !window.opener.closed) { window.opener.postMessage(msg, 'https://glow-ia.fr'); setTimeout(function(){ window.close(); }, 400); return; }
  // Pas de fenêtre d'origine (téléphone, onglet séparé) : on termine la connexion ici
  if (!msg.code) { m.textContent = 'Connexion annulée. Vous pouvez revenir à votre espace et réessayer.'; back.style.display = 'inline-block'; return; }
  fetch('https://n8n-cpov.srv2127351.hstgr.cloud/webhook/connexions-glowia', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'google_code', code: msg.code, state: msg.state, token: localStorage.getItem('glowia_token') || '' }) })
    .then(function(r){ return r.json(); })
    .then(function(res){ m.textContent = res.success ? '✓ ' + (res.message || 'Google Agenda connecté.') : (res.message || 'La connexion n’a pas abouti, réessayez depuis votre espace.'); back.style.display = 'inline-block'; })
    .catch(function(){ m.textContent = 'Souci de réseau. Revenez à votre espace et réessayez.'; back.style.display = 'inline-block'; });
})();
</script></body></html>
