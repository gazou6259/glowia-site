<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Connexion Google — GlowIA</title>
<style>body{font-family:'Work Sans',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:90vh;color:#2B1A1F;background:#F7EFE2;text-align:center;padding:20px}p{max-width:340px;line-height:1.5}</style></head>
<body><p id="m">Connexion Google en cours…</p>
<script>
(function(){
  var p = new URLSearchParams(location.search);
  var msg = { type: 'GLOWIA_GOOGLE', code: p.get('code') || '', state: p.get('state') || '', error: p.get('error') || '' };
  if (window.opener) { window.opener.postMessage(msg, 'https://glow-ia.fr'); setTimeout(function(){ window.close(); }, 400); }
  else { document.getElementById('m').textContent = msg.code ? 'Connexion reçue. Revenez sur votre espace GlowIA.' : 'Connexion annulée. Vous pouvez fermer cette page.'; }
})();
</script></body></html>
