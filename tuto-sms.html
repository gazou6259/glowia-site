<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Connecter les SMS du salon · tutoriel interactif · GlowIA</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --laque:#5B2A3C; --laque-clair:#7A3D53; --ivoire:#F6EFE8; --porcelaine:#FBF7F3;
  --laiton:#B88A72; --laiton-profond:#93684F; --nacre:#E8C4C0; --encre:#2B1A1F; --encre-doux:#5a4148;
  --vert:#3D7A4A; --ios-bleu:#0A7AFF; --ios-gris:#F2F2F7; --ios-trait:#D9D9DE; --ios-texte2:#8A8A8E;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--ivoire);color:var(--encre);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;background:radial-gradient(120% 80% at 10% 0%,#fff 0,rgba(255,255,255,0) 55%),radial-gradient(90% 70% at 100% 100%,rgba(232,196,192,.55) 0,rgba(232,196,192,0) 60%),var(--ivoire)}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
.haut{max-width:1080px;margin:0 auto;padding:22px 20px 6px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-family:'Lora',serif;font-weight:600;font-size:22px;color:var(--laque);text-decoration:none}
.logo span{color:var(--laiton)}
.haut a.retour{font-size:14px;color:var(--encre-doux);text-decoration:none}
.titre{max-width:1080px;margin:0 auto;padding:10px 20px 0}
.titre h1{font-family:'Lora',serif;font-weight:500;font-size:clamp(26px,4.4vw,38px);line-height:1.15;color:var(--laque)}
.titre h1 em{color:var(--laiton-profond)}
.titre p{margin-top:8px;color:var(--encre-doux);font-size:15.5px;max-width:620px;line-height:1.5}

.etapes{max-width:1080px;margin:18px auto 0;padding:0 20px;display:flex;gap:6px;flex-wrap:wrap}
.etapes button{display:flex;align-items:center;gap:7px;padding:7px 12px 7px 7px;border-radius:99px;background:rgba(255,255,255,.6);border:1px solid rgba(91,42,60,.12);font-size:13px;color:var(--encre-doux);transition:.3s var(--ease)}
.etapes button i{font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--nacre);color:var(--laque);font-weight:600;font-size:12px}
.etapes button.fait i{background:var(--vert);color:#fff}
.etapes button.actif{background:var(--laque);color:#fff;border-color:var(--laque)}
.etapes button.actif i{background:#fff;color:var(--laque)}

.scene{max-width:1080px;margin:0 auto;padding:22px 20px 40px;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:40px;align-items:start}
@media (max-width:860px){
  .haut{padding:10px 16px 0}.titre{display:none}
  .carte:not(.ouvert) .pourquoi,.carte:not(.ouvert) .astuce{display:none}.btn.plus{display:inline-block!important}
  .etapes{flex-wrap:nowrap;overflow-x:auto;padding:0 16px 4px;margin-top:10px;scrollbar-width:none}.etapes::-webkit-scrollbar{display:none}
  .etapes button{flex:none}
  .scene{grid-template-columns:1fr;gap:0;padding:8px 0 0}
  .tel-zone{padding-bottom:var(--bas,260px)}.etiquette{margin-bottom:6px;font-size:11px;padding:4px 10px}
  .tel{transform:scale(var(--k,1));transform-origin:top center;margin-bottom:calc((var(--k,1) - 1) * 690px)}
  .carte{position:fixed;left:0;right:0;bottom:0;top:auto;border-radius:22px 22px 0 0;padding:16px 18px calc(14px + env(safe-area-inset-bottom));max-height:46vh;overflow:auto;z-index:100;box-shadow:0 -14px 40px -20px rgba(91,42,60,.5)}
  .carte h2{font-size:19px;margin-top:2px}.carte .consigne{margin-top:8px;font-size:16px}.carte .pourquoi{font-size:13.5px;margin-top:6px}
  .carte .astuce{font-size:12.5px;margin-top:8px}.carte .a-vous{display:none}.barre{margin-top:12px}.cmd{margin-top:12px}.btn{padding:10px 16px;font-size:14px}
  .carte .mention{display:none}
}
@media (max-width:400px){.tel{transform:scale(var(--k,.9))}}

/* Carte d'explication */
.carte{background:var(--porcelaine);border:1px solid rgba(91,42,60,.1);border-radius:22px;padding:26px 24px;box-shadow:0 18px 50px -30px rgba(91,42,60,.45);position:sticky;top:18px}
.carte .num{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--laiton-profond);font-weight:600}
.carte h2{font-family:'Lora',serif;font-weight:500;font-size:25px;color:var(--laque);margin-top:6px;line-height:1.2}
.carte .consigne{margin-top:16px;font-size:17px;line-height:1.45;font-weight:500}
.carte .consigne b{background:linear-gradient(transparent 58%,rgba(232,196,192,.8) 58%);font-weight:600}
.carte .pourquoi{margin-top:10px;font-size:14.5px;color:var(--encre-doux);line-height:1.5}
.carte .astuce{margin-top:14px;font-size:13.5px;background:#fff;border-left:3px solid var(--laiton);padding:10px 12px;border-radius:0 10px 10px 0;color:var(--encre-doux);line-height:1.45}
.barre{margin-top:20px;height:4px;border-radius:4px;background:rgba(91,42,60,.1);overflow:hidden}
.barre div{height:100%;background:linear-gradient(90deg,var(--laiton),var(--laque));width:0;transition:width .5s var(--ease)}
.cmd{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.btn{padding:12px 18px;border-radius:99px;font-weight:600;font-size:14.5px;transition:.25s var(--ease)}
.btn.plein{background:var(--laque);color:#fff}
.btn.plein:hover{background:var(--laque-clair)}
.btn.clair{background:#fff;color:var(--laque);border:1px solid rgba(91,42,60,.18)}
.btn[hidden]{display:none}
.btn.plus{display:none;background:none;color:var(--laiton-profond);padding:10px 6px;text-decoration:underline}
.a-vous{margin-top:14px;font-size:13px;color:var(--laiton-profond);display:flex;align-items:center;gap:8px}
.a-vous::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--laiton);animation:pouls 1.4s infinite}
.mention{margin-top:18px;font-size:12px;color:var(--ios-texte2);line-height:1.45}

/* Téléphone */
.tel-zone{display:flex;flex-direction:column;align-items:center}
.etiquette{font-size:12.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--laque);background:#fff;border:1px solid rgba(91,42,60,.15);padding:6px 12px;border-radius:99px;margin-bottom:12px;transition:.3s}
.etiquette.autre{background:var(--laque);color:#fff}
.tel{width:330px;height:690px;border-radius:54px;background:#1c1416;padding:12px;box-shadow:0 40px 80px -40px rgba(43,26,31,.7),inset 0 0 0 2px #3a2b30;position:relative}
.ecran{width:100%;height:100%;border-radius:43px;overflow:hidden;position:relative;background:#fff;font-family:-apple-system,'SF Pro Text','Inter',system-ui,sans-serif;color:#000}
.ilot{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:96px;height:28px;border-radius:20px;background:#000;z-index:50}
.statut{height:50px;display:flex;justify-content:space-between;align-items:flex-end;padding:0 28px 6px;font-size:14px;font-weight:600;position:relative;z-index:5}
.statut .ic{display:flex;gap:5px;align-items:center}
.statut .ic i{display:block;width:16px;height:10px;border-radius:2px;background:currentColor;opacity:.9}
.statut .ic i.bat{width:22px;height:11px;border-radius:3px;border:1.5px solid currentColor;background:linear-gradient(90deg,currentColor 75%,transparent 75%);opacity:.9}
.vue{position:absolute;inset:0;display:flex;flex-direction:column;animation:entre .42s var(--ease) both}
.vue.recule{animation:sort .42s var(--ease) both}
@keyframes entre{from{transform:translateX(26%);opacity:0}to{transform:none;opacity:1}}
@keyframes sort{from{transform:translateX(-26%);opacity:0}to{transform:none;opacity:1}}
.corps{flex:1;overflow:hidden;position:relative}
.gris{background:var(--ios-gris)}
.nav{display:flex;justify-content:space-between;align-items:center;padding:6px 16px;min-height:40px;font-size:16px}
.nav .lien{color:var(--ios-bleu);display:flex;align-items:center;gap:3px}
.nav .lien.gras{font-weight:600}
.nav .milieu{font-weight:600}
.grand{font-size:31px;font-weight:700;padding:2px 18px 10px;letter-spacing:-.02em}
.groupe{margin:0 16px 18px;background:#fff;border-radius:12px;overflow:hidden}
.groupe .l{display:flex;align-items:center;gap:12px;padding:11px 14px;font-size:16px;position:relative}
.groupe .l+.l::before{content:"";position:absolute;top:0;left:52px;right:0;height:.5px;background:var(--ios-trait)}
.groupe.sans .l+.l::before{left:14px}
.groupe .l .pic{width:29px;height:29px;border-radius:7px;flex:none}
.groupe .l .d{margin-left:auto;color:var(--ios-texte2);display:flex;align-items:center;gap:6px;font-size:15px}
.chev::after{content:"›";font-size:22px;color:#C4C4C7;line-height:0}
.legende{font-size:13px;color:var(--ios-texte2);text-transform:uppercase;padding:0 30px 6px;letter-spacing:.01em}
.note-ios{font-size:13px;color:var(--ios-texte2);padding:0 30px 16px;line-height:1.35;margin-top:-10px}
.radio{width:22px;height:22px;border-radius:50%;border:1.5px solid #C7C7CC;flex:none;margin-left:auto}
.radio.on{border:0;background:var(--ios-bleu);box-shadow:inset 0 0 0 6px var(--ios-bleu),inset 0 0 0 8px #fff}
.inter{width:51px;height:31px;border-radius:99px;background:#34C759;position:relative;margin-left:auto;flex:none;transition:.3s}
.inter::after{content:"";position:absolute;top:2px;left:22px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:.3s var(--ease)}
.inter.off{background:#E9E9EB}
.inter.off::after{left:2px}
.onglets{display:flex;justify-content:space-around;padding:8px 0 26px;border-top:.5px solid var(--ios-trait);background:rgba(249,249,249,.95);font-size:10.5px;color:var(--ios-texte2)}
.onglets div{display:flex;flex-direction:column;align-items:center;gap:3px;padding:2px 8px;border-radius:10px}
.onglets div i{width:24px;height:22px;border-radius:6px;background:currentColor;opacity:.55;display:block}
.onglets .on{color:var(--ios-bleu)}
.onglets .on i{opacity:1}
.tuile{margin:0 16px;width:calc(50% - 22px);height:96px;border-radius:16px;padding:12px;color:#fff;display:flex;flex-direction:column;justify-content:space-between;font-weight:600;font-size:15px;background:linear-gradient(140deg,#B88A72,#5B2A3C)}
.tuile .rond{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.3)}
.vide{color:var(--ios-texte2);text-align:center;padding:60px 30px;font-size:15px;line-height:1.4}
.carte-auto{margin:0 16px 10px;background:#fff;border-radius:14px;padding:13px 14px;font-size:14.5px}
.carte-auto small{display:block;color:var(--ios-texte2);font-size:13px;margin-top:3px}
.carte-auto .fl{display:flex;align-items:center;gap:8px;margin-top:8px;color:var(--ios-texte2);font-size:13px}
.carte-auto .fl b{color:#fff;background:linear-gradient(140deg,#B88A72,#5B2A3C);padding:4px 9px;border-radius:7px;font-weight:600;font-size:12.5px}
.recherche{margin:0 16px 12px;background:#E3E3E8;border-radius:10px;padding:8px 12px;color:var(--ios-texte2);font-size:15px}

/* Accueil */
.accueil{background:linear-gradient(170deg,#E8C4C0 0%,#B88A72 55%,#5B2A3C 100%)}
.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 10px;padding:28px 18px}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.app i{width:60px;height:60px;border-radius:15px;display:block;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.app.rac i{background:conic-gradient(from 200deg,#ff4f8b,#ffb347,#5ad1ff,#8a5cff,#ff4f8b);position:relative}
.app.rac i::after{content:"";position:absolute;inset:16px;border-radius:7px;border:4px solid rgba(255,255,255,.95);transform:rotate(45deg) scale(.8)}

/* Safari / espace GlowIA */
.safari{background:var(--ivoire)}
.barre-url{margin:4px 14px 8px;background:rgba(255,255,255,.85);border-radius:12px;padding:9px;text-align:center;font-size:14px;color:#333}
.kit{margin:6px 14px;background:#fff;border-radius:18px;padding:18px 16px;font-family:'Inter',sans-serif;color:var(--encre);box-shadow:0 10px 30px -18px rgba(91,42,60,.5)}
.kit .k-haut{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--laiton-profond);font-weight:600}
.kit h4{font-family:'Lora',serif;font-weight:500;font-size:20px;color:var(--laque);margin:6px 0 8px}
.kit p{font-size:13.5px;line-height:1.45;color:var(--encre-doux)}
.kit .code{margin:14px 0 8px;display:flex;align-items:center;gap:8px}
.kit .code code{flex:1;font-family:ui-monospace,Menlo,monospace;font-size:15px;background:var(--ivoire);border:1px dashed var(--laiton);border-radius:10px;padding:11px 10px;color:var(--laque);letter-spacing:.04em}
.kit .kb{display:inline-block;background:var(--laque);color:#fff;border-radius:99px;padding:10px 16px;font-weight:600;font-size:14px}
.kit .kb.clair{background:#fff;color:var(--laque);border:1px solid rgba(91,42,60,.2)}
.kit small.ex{display:block;margin-top:6px;font-size:11.5px;color:var(--laiton-profond)}
.verif{list-style:none;margin-top:12px;display:flex;flex-direction:column;gap:10px}
.verif li{display:flex;gap:10px;align-items:flex-start;font-size:13.5px}
.verif li small{display:block;color:var(--encre-doux);font-size:12px;margin-top:2px}
.verif .rd{width:24px;height:24px;border-radius:50%;flex:none;border:2px solid var(--nacre);display:grid;place-items:center;font-size:10px;font-weight:700;color:var(--laiton-profond);transition:.5s var(--ease)}
.verif li.att .rd{border-color:var(--laiton);border-top-color:transparent;animation:tourne 1s linear infinite}
.verif li.ok .rd{background:var(--vert);border-color:var(--vert);color:#fff;animation:pop .5s var(--ease)}
.verif li.ok .rd::after{content:"✓";font-size:13px}
.bravo{margin-top:14px;background:#EAF3EC;border-radius:12px;padding:12px;font-size:13px;color:#24502F;line-height:1.4;animation:pop .5s var(--ease)}
.bravo b{display:block;font-size:15px;margin-bottom:3px}
@keyframes tourne{to{transform:rotate(360deg)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.1)}100%{transform:none;opacity:1}}

/* Feuille d'import */
.voile{position:absolute;inset:0;background:rgba(0,0,0,.32);z-index:20;animation:fond .3s both}
@keyframes fond{from{opacity:0}}
.feuille{position:absolute;left:0;right:0;bottom:0;top:58px;background:var(--ios-gris);border-radius:14px 14px 0 0;z-index:21;animation:monte .45s var(--ease) both;display:flex;flex-direction:column}
@keyframes monte{from{transform:translateY(100%)}}
.feuille .ico{width:64px;height:64px;border-radius:15px;margin:14px auto 8px;background:linear-gradient(140deg,#B88A72,#5B2A3C)}
.feuille h5{text-align:center;font-size:20px;font-weight:700}
.feuille .sous{text-align:center;color:var(--ios-texte2);font-size:13.5px;margin:4px 30px 18px;line-height:1.35}
.champ{display:flex;align-items:center;padding:12px 14px;font-size:16px;gap:10px;position:relative}
.champ .val{flex:1;text-align:right;white-space:nowrap;color:#C4C4C7;font-family:ui-monospace,Menlo,monospace;font-size:14px}
.champ .val.pleine{color:#000}
.bulle{position:absolute;right:30px;top:-40px;background:#2c2c2e;color:#fff;border-radius:9px;padding:9px 16px;font-size:15px;animation:pop .3s var(--ease);z-index:3}
.bulle::after{content:"";position:absolute;bottom:-6px;left:50%;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:#2c2c2e}
.gros-bleu{margin:auto 16px 30px;background:var(--ios-bleu);color:#fff;text-align:center;border-radius:13px;padding:15px;font-weight:600;font-size:16px}
.gros-bleu.inactif{opacity:.4}

/* Alerte */
.alerte{position:absolute;inset:0;margin:auto;height:fit-content;width:256px;background:rgba(242,242,247,.97);border-radius:14px;z-index:21;text-align:center;overflow:hidden;animation:pop .35s var(--ease) both}
.alerte p{padding:18px 16px 14px;font-size:15px;line-height:1.3}
.alerte p b{display:block;margin-bottom:4px}
.alerte p small{font-size:13px;color:#3c3c43}
.alerte button{display:block;width:100%;padding:11px;border-top:.5px solid #C6C6C8;color:var(--ios-bleu);font-size:16px}
.alerte button.g{font-weight:600}

/* Messages */
.msgs{background:#fff}
.contact{text-align:center;padding:4px 0 10px;border-bottom:.5px solid var(--ios-trait);font-size:12px}
.contact i{width:44px;height:44px;border-radius:50%;margin:0 auto 4px;display:block;background:linear-gradient(140deg,#E8C4C0,#B88A72)}
.fil{flex:1;padding:16px 14px;display:flex;flex-direction:column;justify-content:flex-end;gap:6px}
.bulle-sms{align-self:flex-end;background:#34C759;color:#fff;padding:8px 13px;border-radius:18px;font-size:16px;animation:pop .4s var(--ease)}
.bulle-sms+small{align-self:flex-end;font-size:11px;color:var(--ios-texte2)}
.saisie{display:flex;align-items:center;gap:8px;padding:8px 12px 30px}
.saisie div{flex:1;border:1px solid var(--ios-trait);border-radius:18px;padding:7px 12px;font-size:16px;min-height:34px}
.envoi{width:30px;height:30px;border-radius:50%;background:#34C759;color:#fff;display:grid;place-items:center;font-size:17px;font-weight:700}

/* Ciblage */
.cible{position:relative;z-index:30;border-radius:12px;cursor:pointer}
.cible::after{content:"";position:absolute;inset:-5px;border-radius:inherit;border:3px solid var(--laiton);box-shadow:0 0 0 4px rgba(184,138,114,.25);animation:anneau 1.4s ease-in-out infinite;pointer-events:none}
@keyframes anneau{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(1.035)}}
@keyframes pouls{0%,100%{opacity:1}50%{opacity:.3}}
.doigt{position:absolute;width:44px;height:44px;border-radius:50%;background:rgba(91,42,60,.28);border:2px solid rgba(255,255,255,.9);z-index:60;pointer-events:none;transform:translate(-50%,-50%) scale(.6);opacity:0;transition:left .7s var(--ease),top .7s var(--ease),opacity .3s,transform .2s}
.doigt.vis{opacity:1;transform:translate(-50%,-50%) scale(1)}
.doigt.appui{transform:translate(-50%,-50%) scale(.75);background:rgba(91,42,60,.5)}
.jauge{position:absolute;inset:-5px;border-radius:12px;border:3px solid var(--vert);clip-path:inset(0 100% 0 0);transition:clip-path .5s linear;pointer-events:none;z-index:31}
.jauge.go{clip-path:inset(0 0 0 0)}
.toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:rgba(43,26,31,.9);color:#fff;font-size:13.5px;padding:8px 14px;border-radius:99px;z-index:40;animation:pop .3s var(--ease);white-space:nowrap}
.fin-carte ul{margin-top:12px;padding-left:18px;font-size:14.5px;line-height:1.55;color:var(--encre-doux)}
.fin-carte ul li{margin-bottom:6px}
.fin-carte a{color:var(--laque)}
</style>
</head>
<body>
<header class="haut">
  <a class="logo" href="/">Glow<span>IA</span></a>
  <a class="retour" href="/portail.html">‹ Retour à votre espace</a>
</header>
<section class="titre">
  <h1>Connecter les SMS du salon, <em>en vous entraînant</em></h1>
  <p>Faites les gestes ici, sur un iPhone d'entraînement. Touchez l'élément qui brille, comme vous le ferez ensuite sur l'iPhone du salon.</p>
</section>
<nav class="etapes" id="etapes"></nav>
<main class="scene">
  <div class="tel-zone">
    <div class="etiquette" id="etiquette">iPhone du salon</div>
    <div class="tel"><div class="ecran" id="ecran"><div class="ilot"></div></div></div>
  </div>
  <aside class="carte" id="carte" aria-live="polite"></aside>
</main>

<script>
(function(){
const CODE='EXEMPLE-0000';
const ETAPES=['Avant de commencer','Votre code salon','Ajouter le raccourci','Répondre aux SMS','Les rappels de 19 h','Le test'];
const st={};          // état des écrans
const statut=(clair)=>`<div class="statut" style="${clair?'color:#fff':''}"><span>9:41</span><span class="ic"><i></i><i class="bat"></i></span></div>`;

/* ---------- Moteur ---------- */
const ecran=document.getElementById('ecran'),carte=document.getElementById('carte'),nav=document.getElementById('etapes'),etiq=document.getElementById('etiquette');
let i=0,ecranCourant='',demoEnCours=false,timers=[];
const enStock=['']; // instantanés d'état pour le retour
const snaps=[];
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;ecran.appendChild(d);setTimeout(()=>d.remove(),1400)}
function clearT(){timers.forEach(clearTimeout);timers=[]}

nav.innerHTML=ETAPES.map((n,k)=>`<button data-k="${k}"><i>${k+1}</i>${n}</button>`).join('');
nav.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;sauterA(+b.dataset.k)});

function sauterA(k){ // rejoue silencieusement jusqu'au début de l'étape k
  clearT();Object.keys(st).forEach(x=>delete st[x]);
  let j=0;while(A[j].e<k){if(A[j].fx)A[j].fx();j++}
  st.alerte=0;st.bulle=0;snaps.length=0;i=j;afficher(true);
}

function afficher(force,recule){
  clearT();
  const a=A[i];
  if(a.e===6) return fin();
  snaps[i]=JSON.stringify(st);
  // étapes
  [...nav.children].forEach((b,k)=>{b.classList.toggle('actif',k===a.e);b.classList.toggle('fait',k<a.e)});
  const ba=nav.children[a.e];if(ba&&innerWidth<=860)nav.scrollTo({left:ba.offsetLeft-16,behavior:'smooth'});
  etiq.textContent=a.autre?'Un autre téléphone':'iPhone du salon';etiq.classList.toggle('autre',!!a.autre);
  // écran
  const html=E[a.s]();
  const vieux=ecran.querySelector('.vue');
  if(force||a.s!==ecranCourant||!vieux){
    if(vieux)vieux.remove();
    ecran.insertAdjacentHTML('beforeend',html);
    const v=ecran.querySelector('.vue');if(recule)v.classList.add('recule');
    if(a.s===ecranCourant&&!force)v.style.animation='none';
  }else{
    vieux.outerHTML=html;ecran.querySelector('.vue').style.animation='none';
  }
  ecranCourant=a.s;
  // carte
  const total=A.length-1;
  carte.innerHTML=`<div class="num">Étape ${a.e+1} sur 6</div><h2>${ETAPES[a.e]}</h2>
    <p class="consigne">${a.c}</p>${a.p?`<p class="pourquoi">${a.p}</p>`:''}${a.ast?`<p class="astuce">${a.ast}</p>`:''}
    ${a.t&&a.t[0]!=='@'?'<p class="a-vous">À vous : touchez l\'élément qui brille sur l\'iPhone.</p>':''}
    <div class="barre"><div style="width:${Math.round(i/total*100)}%"></div></div>
    <div class="cmd">${a.t==='@'?'<button class="btn plein" id="bSuiv">Continuer</button>':''}
      ${a.t&&a.t[0]!=='@'?'<button class="btn clair" id="bDemo">Montrez-moi</button>':''}
      <button class="btn clair" id="bPrec" ${i===0?'hidden':''}>Retour</button>${(a.p||a.ast)?'<button class="btn plus" id="bPlus">Pourquoi ?</button>':''}</div>
    <p class="mention">Entraînement : iPhone reconstitué, code d'exemple, données fictives. Les écrans peuvent varier un peu selon la version d'iOS.</p>`;
  const bs=document.getElementById('bSuiv');if(bs){bs.onclick=avancer;}
  const bd=document.getElementById('bDemo');if(bd)bd.onclick=montrer;
  document.getElementById('bPrec').onclick=reculer;
  const bp=document.getElementById('bPlus');if(bp)bp.onclick=()=>{carte.classList.toggle('ouvert');bp.textContent=carte.classList.contains('ouvert')?'Masquer':'Pourquoi ?'};
  carte.classList.remove('ouvert');
  // cible
  if(a.t==='@auto'){
    st.v=0;rafraichir();
    timers.push(setTimeout(()=>{st.v=1;rafraichir()},1400));
    timers.push(setTimeout(()=>{st.v=2;rafraichir();toast('C\'est relié ✓');
      carte.querySelector('.cmd').insertAdjacentHTML('afterbegin','<button class="btn plein" id="bSuiv">Terminer</button>');document.getElementById('bSuiv').onclick=avancer;},3000));
    return;
  }
  if(a.t&&a.t[0]!=='@') armer(a);
}
function rafraichir(){const v=ecran.querySelector('.vue');v.outerHTML=E[A[i].s]();ecran.querySelector('.vue').style.animation='none'}

function armer(a){
  const el=ecran.querySelector(`[data-t="${a.t}"]`);if(!el)return;
  el.classList.add('cible');
  if(a.hold){
    let t0=0,j=null,tm=null;
    const debut=e=>{e.preventDefault();t0=Date.now();j=document.createElement('span');j.className='jauge';el.appendChild(j);requestAnimationFrame(()=>j.classList.add('go'));tm=setTimeout(()=>{fin_();avancer()},500)};
    const fin_=()=>{clearTimeout(tm);if(j){j.remove();j=null}};
    const stop=()=>{if(!t0)return;const d=Date.now()-t0;t0=0;fin_();if(d<500)toast('Gardez le doigt appuyé un instant')};
    el.addEventListener('pointerdown',debut);el.addEventListener('pointerup',stop);el.addEventListener('pointerleave',stop);
    el.addEventListener('contextmenu',e=>e.preventDefault());
  }else el.addEventListener('click',avancer,{once:true});
}
function avancer(){if(i>=A.length-1)return;const a=A[i];if(a.fx)a.fx();i++;afficher()}
function reculer(){if(i===0)return;i--;while(i>0&&A[i].t==='@auto')i--;const s=JSON.parse(snaps[i]||'{}');Object.keys(st).forEach(x=>delete st[x]);Object.assign(st,s);afficher(true,true)}
function montrer(){
  if(demoEnCours)return;const a=A[i];const el=ecran.querySelector(`[data-t="${a.t}"]`);if(!el)return;demoEnCours=true;
  const r=el.getBoundingClientRect(),re=ecran.getBoundingClientRect(),sc=re.width/ecran.offsetWidth;
  const d=document.createElement('div');d.className='doigt';d.style.left='50%';d.style.top='92%';ecran.appendChild(d);
  requestAnimationFrame(()=>{d.classList.add('vis');d.style.left=((r.left-re.left+r.width/2)/sc)+'px';d.style.top=((r.top-re.top+r.height/2)/sc)+'px'});
  setTimeout(()=>{d.classList.add('appui');if(a.hold){const j=document.createElement('span');j.className='jauge';el.appendChild(j);requestAnimationFrame(()=>j.classList.add('go'))}},800);
  setTimeout(()=>{d.remove();demoEnCours=false;if(A[i]===a)avancer()},a.hold?1400:1150);
}
function fin(){
  [...nav.children].forEach(b=>{b.classList.remove('actif');b.classList.add('fait')});
  etiq.textContent='iPhone du salon';etiq.classList.remove('autre');
  carte.innerHTML=`<div class="fin-carte"><div class="num">Terminé</div><h2>Vous savez faire.</h2>
   <p class="consigne">Refaites maintenant ces gestes sur l'iPhone du salon, avec votre vrai code.</p>
   <ul><li>Gardez l'iPhone du salon <b>allumé et connecté</b>. S'il ne donne plus de nouvelles, vous recevez une alerte sur Telegram.</li>
   <li>Ça ne passe pas au vert ? Vérifiez que l'automatisation « Message » est bien activée et que le code a été collé à la place de CODE-SALON.</li>
   <li>Besoin d'aide ? Écrivez à <a href="mailto:contact@glow-ia.fr?subject=SMS%20du%20salon">contact@glow-ia.fr</a>.</li></ul>
   <div class="cmd"><a class="btn plein" href="/portail.html" style="text-decoration:none">Ouvrir mon espace</a><button class="btn clair" id="bRe">Recommencer</button></div>
   <p class="mention">Vous gardez la main : l'assistant répond, vous reprenez une conversation quand vous voulez.</p></div>`;
  document.getElementById('bRe').onclick=()=>sauterA(0);
}
function ajuster(){
  const z=document.querySelector('.tel-zone'),t=document.querySelector('.tel');
  if(innerWidth>860){document.documentElement.style.removeProperty('--k');z.style.removeProperty('--bas');return}
  const h=carte.offsetHeight;z.style.setProperty('--bas',(h+8)+'px');
  const haut=t.getBoundingClientRect().top+scrollY;
  const k=Math.max(.45,Math.min(1,(innerHeight-h-haut-8)/690,(innerWidth-24)/330));
  document.documentElement.style.setProperty('--k',k.toFixed(3));
}
new ResizeObserver(ajuster).observe(carte);addEventListener('resize',ajuster);
afficher(true);ajuster();
})();
</script>
